<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title color="secondary">Tentang Aplikasi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Tentang Aplikasi</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Toko Makmur Jaya</ion-card-title>
      <ion-card-subtitle>Aplikasi pengelolaan toko</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      Kelola produk, keranjang belanja, dan transaksi toko dalam satu aplikasi.
    </ion-card-content>
  </ion-card>
</ion-content>
