<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title
      class="page-title"
      >Keranjang</ion-title
    >
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">keranjang</ion-title>
    </ion-toolbar>
  </ion-header>

  <div
    *ngIf="keranjang.items.length === 0"
    class="empty-state"
  >
    <ion-icon name="cart-outline" style="font-size: 64px"></ion-icon>
    <p>Keranjang masih kosong</p>
  </div>
  <ion-list *ngIf="keranjang.items.length > 0" style="background: transparent">
    <ion-item-sliding *ngFor="let item of keranjang.items" #slide>
      <ion-item
        lines="none"
        class="cart-item"
      >
        <ion-checkbox
          slot="start"
          [(ngModel)]="item.dipilih"
          style="margin-right: 8px"
        ></ion-checkbox>
        <ion-thumbnail slot="start">
          <img
            [src]="item.gambar || 'assets/no_image.png'"
            style="border-radius: 12px; object-fit: cover"
          />
        </ion-thumbnail>

        <ion-label>
          <h2>{{ item.nama }}</h2>
          <p>Rp {{ item.hargaJual }}</p>
          <ion-chip
            *ngIf="item.stok <= 3"
            color="warning"
            style="height: 20px; font-size: 11px; margin-top: 4px"
          >
            Sisa stok {{ item.stok }}
          </ion-chip>
        </ion-label>

        <div slot="end" style="display: flex; align-items: center; gap: 6px">
          <ion-button
            size="small"
            fill="clear"
            color="danger"
            (click)="hapus(item, slide)"
          >
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button size="small" fill="clear" (click)="kurang(item)">
            <ion-icon name="remove-circle-outline"></ion-icon>
          </ion-button>

          <span
            class="qty-text"
            [ngStyle]="{ transform: bumpId === item.produkId ? 'scale(1.3)' : 'scale(1)'}"
          >
            {{ item.qty }}
          </span>
          <ion-button
            size="small"
            fill="clear"
            (click)="tambah(item)"
            [disabled]="item.qty >= item.stok"
          >
            <ion-icon name="add-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="hapus(item, slide)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>

<ion-footer *ngIf="keranjang.items.length > 0">
  <div
    class="footer-bar"
  >
    <div>
      <p class="footer-label">
        Total Belanja ({{ keranjang.jumlahDipilih }} produk dipilih)
      </p>
      <h2 style="margin: 0">Rp {{ keranjang.totalHarga }}</h2>
    </div>
    <ion-button (click)="konfirmasi()" shape="round">
      Konfirmasi Transaksi
    </ion-button>
  </div>
</ion-footer>
