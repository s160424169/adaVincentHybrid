<ion-header [translucent]="true">
  <ion-toolbar
    class="header-toolbar"
  >
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>

    <ion-title
      class="page-title"
    >
      Profil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="color: #ffff">
  <!-- Foto dan nama toko -->
  <div
    class="profile-banner"
  >
    <img
      src="https://www.bayarind.id/wp-content/uploads/2024/09/gambar-toko-kelontong-dari-depan.jpg"
      alt="Logo Toko"
      class="profile-avatar"
    />

    <div class="nama-toko">
      Toko Makmur Jaya
    </div>

    <div
      class="role-toko"
    >
      Administrator
    </div>
  </div>

  <!-- Informasi toko -->
  <div class="info-section">
    <div class="info-title">
      Informasi Toko
    </div>

    <!-- Nama Toko -->
    <ion-item>
      <ion-icon name="storefront-outline" slot="start"></ion-icon>

      <ion-label>
        <p>Nama Toko</p>
        <strong> Toko Makmur Jaya </strong>
      </ion-label>
    </ion-item>

    <!-- Pemilik -->
    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>

      <ion-label>
        <p>Pemilik</p>
        <strong> Bu Marni </strong>
      </ion-label>
    </ion-item>

    <!-- Status Akun -->
    <ion-item lines="none">
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>

      <ion-label>
        <p>Status Akun</p>
        <strong> Aktif </strong>
      </ion-label>
    </ion-item>
  </div>
</ion-content>
