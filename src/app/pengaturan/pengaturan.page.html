<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title color="secondary">Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Pengaturan</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="settings-card">
    <h3 class="card-title">Tampilan Aplikasi</h3>

    <ion-item lines="none" class="settings-item">
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Mode Gelap</ion-label>
      <ion-toggle [(ngModel)]="tema.modeGelap" (ionChange)="tema.toggleGelap($event.detail.checked)"></ion-toggle>
    </ion-item>
  </div>

  <div class="settings-card-alt">
    <h3 class="card-title">Warna Identitas Toko</h3>
    <p class="section-desc">
      Pilih warna aksen sesuai identitas Toko Makmur Jaya
    </p>

    <div class="palette-list">
      <ion-chip *ngFor="let p of tema.daftarPalet" (click)="tema.pilihPalet(p)" [ngStyle]="{
                  background: p.primary,
                  color: p.contrast,
                  border: p.nama === tema.paletAktif ? '3px solid white' : '1px solid rgba(255,255,255,0.3)',
                  transform: p.nama === tema.paletAktif ? 'scale(1.08)' : 'scale(1)',
                  transition: 'all 0.2s ease'
                }">
        <ion-icon *ngIf="p.nama === tema.paletAktif" name="checkmark-outline"></ion-icon>
        {{ p.label }}
      </ion-chip>
    </div>
  </div>
</ion-content>
