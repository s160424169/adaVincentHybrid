<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content style="--background: whitesmoke">
      <div class="menu-header">
        <ion-avatar class="menu-avatar">
          <img src="https://www.bayarind.id/wp-content/uploads/2024/09/gambar-toko-kelontong-dari-depan.jpg"
            alt="Logo Toko" />
        </ion-avatar>
        <h3 class="menu-store-name">
          Toko Makmur Jaya
        </h3>
        <p class="menu-subtitle">Menu List</p>
      </div>

      <ion-list lines="none" class="menu-list">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/home" routerDirection="root" class="menu-item">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item routerLink="/produk" routerDirection="root" class="menu-item">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>

          <ion-item routerLink="/keranjang" routerDirection="root" class="menu-item">
            <ion-icon slot="start" name="cart-outline"></ion-icon>
            <ion-label>Keranjang</ion-label>
          </ion-item>

          <ion-item routerLink="/transaksi" routerDirection="root" class="menu-item">
            <ion-icon slot="start" name="receipt-outline"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>

          <ion-item routerLink="/profil" routerDirection="forward" class="menu-item">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/pengaturan" class="menu-item">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/tentang" class="menu-item">
            <ion-icon name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item button (click)="logout()" class="menu-item">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
