<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content style="--background: whitesmoke">
      <div
        style="
          background: var(--ion-color-primary);
          color: white;
          padding: 28px 20px 22px;
          border-bottom-right-radius: 24px;
        "
      >
        <ion-avatar
          style="
            width: 64px;
            height: 64px;
            border: 3px solid var(--ion-color-secondary);
            margin-bottom: 12px;
          "
        >
          <img
            src="https://www.bayarind.id/wp-content/uploads/2024/09/gambar-toko-kelontong-dari-depan.jpg"
            alt="Logo Toko"
          />
        </ion-avatar>
        <h3 style="margin: 0; font-size: 18px; font-weight: 700">
          Toko Makmur Jaya
        </h3>
        <p style="margin: 4px 0 0; font-size: 13px; opacity: 0.8">Menu List</p>
      </div>

      <ion-list
        lines="none"
        style="padding: 16px 12px; background: transparent"
      >
        <ion-menu-toggle auto-hide="false">
          <ion-item
            routerLink="/home"
            routerDirection="root"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item
            routerLink="/produk"
            routerDirection="root"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>

          <ion-item
            routerLink="/keranjang"
            routerDirection="root"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon slot="start" name="cart-outline"></ion-icon>
            <ion-label>Keranjang</ion-label>
          </ion-item>

          <ion-item
            routerLink="/transaksi"
            routerDirection="root"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon slot="start" name="receipt-outline"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>

          <ion-item
            routerLink="/profil"
            routerDirection="forward"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item
            routerLink="/pengaturan"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item
            routerLink="/tentang"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item
            button
            (click)="logout()"
            style="
              --background: transparent;
              --border-radius: 12px;
              --padding-start: 16px;
              margin-bottom: 6px;
              font-weight: 600;
            "
          >
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
