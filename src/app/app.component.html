<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content class="menu-content">
      <div class="menu-header">
        <ion-avatar class="menu-avatar">
          <img src="https://www.bayarind.id/wp-content/uploads/2024/09/gambar-toko-kelontong-dari-depan.jpg"
            alt="Logo Toko" />
        </ion-avatar>
        <h3 class="menu-store-name">
          Toko Makmur Jaya
        </h3>
        <p class="menu-subtitle">Menu List</p>
      </div>

      <ion-list lines="none" class="menu-list">
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/pengaturan" class="menu-item">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/tentang" class="menu-item">
            <ion-icon name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item button (click)="logout()" class="menu-item">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/dashboard" class="menu-item">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/produk" class="menu-item">
            <ion-icon name="grid-outline" slot="start"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/keranjang" class="menu-item">
            <ion-icon name="cart-outline" slot="start"></ion-icon>
            <ion-label>Keranjang</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/transaksi" class="menu-item">
            <ion-icon name="receipt-outline" slot="start"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>
        </ion-menu-toggle>

      </ion-list>
    </ion-content>
  </ion-menu>

   <div class="main-tab-bar">
    <div class="tab-btn" routerLink="/dashboard" routerLinkActive="tab-selected">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </div>
    <div class="tab-btn" routerLink="/produk" routerLinkActive="tab-selected">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Produk</ion-label>
    </div>
    <div class="tab-btn" routerLink="/keranjang" routerLinkActive="tab-selected">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Keranjang</ion-label>
    </div>
    <div class="tab-btn" routerLink="/transaksi" routerLinkActive="tab-selected">
      <ion-icon name="receipt-outline"></ion-icon>
      <ion-label>Transaksi</ion-label>
    </div>
    <div class="tab-btn" routerLink="/profil" routerLinkActive="tab-selected">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </div>
