<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content class="drawer-toko">

      <div class="drawer-header">
        <ion-avatar class="avatar-toko">
          <img src="https://www.bayarind.id/wp-content/uploads/2024/09/gambar-toko-kelontong-dari-depan.jpg" alt="Logo Toko" />
        </ion-avatar>
        <h3>Toko</h3>
      </div>

      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false">
          <ion-item routerLink="/home" routerDirection="root">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item routerLink="/produk" routerDirection="root">
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>

           <ion-item routerLink="/keranjang" routerDirection="root">
            <ion-icon slot="start" name="cart-outline"></ion-icon>
            <ion-label>Keranjang</ion-label>
          </ion-item>

          <ion-item routerLink="/profil" routerDirection="forward">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
