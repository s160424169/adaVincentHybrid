<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
      <ion-back-button defaultHref="/produk" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title color="secondary">Detail Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Detail Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngIf="produk">
    <img [alt]="produk.nama" [src]="produk.gambar || 'assets/no_image.png'" />
    <ion-card-header>
      <ion-card-title>{{ produk.nama }}</ion-card-title>
      <ion-card-subtitle>Kategori: {{ produk.kategori }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-label>Stok Tersisa</ion-label>
        <ion-note slot="end">{{ produk.stok }}</ion-note>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Harga Beli</ion-label>
        <ion-note slot="end">Rp {{ produk.hargaBeli }}</ion-note>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Harga Jual</ion-label>
        <ion-note slot="end">Rp {{ produk.hargaJual }}</ion-note>
      </ion-item>
      <ion-item lines="none">
        <ion-label><strong>Untung per item</strong></ion-label>
        <ion-note slot="end" color="success"><strong>Rp {{ untung }}</strong></ion-note>
      </ion-item>
    </ion-card-content>
  </ion-card>
  <div *ngIf="!produk" class="empty-state">
    <p>Produk tidak ditemukan</p>
  </div>
</ion-content>
